<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fluxo de Medidas Disciplinares</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra de perfil no topo; fila de solicitações à esquerda, detalhe com ações à direita (empilha no celular).
   Cores e fonte do Manual de Identidade Visual CGB 1.3: vinho #711424 (Pantone 229C) e família Arial. */
/* Visual CGB claro (Manual de Identidade Visual CGB 1.3): vinho #711424, vinho escuro #4A0B16,
   branco nos painéis, cinza gelo no fundo, cinza suave nos textos de apoio. Sempre claro, sem modo escuro. */
:root {
  color-scheme: light;
  --bg: #f4f4f4;
  --surface: #ffffff;
  --sunken: #eaeaea;
  --line: #dedadb;
  --fg: #2b2a2a;
  --muted: #6b6a6a;
  --soft: #a0a0a0;
  --brand-grey: #4a4a49;
  --accent: #711424;
  --accent-2: #4a0b16;
  --accent-ink: #ffffff;
  --accent-soft: #f6e9ec;
  --ok: #1f7a4d; --ok-soft: #e3f3ea;
  --warn: #8f5400; --warn-soft: #fdf2df;
  --info: #255d8f; --info-soft: #e5eff8;
  --crit: #b3261e; --crit-soft: #fce7e5;
  --paper: #ffffff; --paper-ink: #1f1e1e; --paper-muted: #4a4a49;
  --display: "Arial Black", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --mono: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --serif: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --line-accent: #e8cdd3;
  --c-susp: #711424; --c-adv: #c47a88;
}
/* Tema escuro, escolhido pelo botão do cabeçalho (o documento oficial continua em papel branco) */
:root[data-tema="escuro"] {
  color-scheme: dark;
  --bg: #141112;
  --surface: #1f1a1b;
  --sunken: #2a2324;
  --line: #3b3234;
  --fg: #f1ecec;
  --muted: #b3aaab;
  --soft: #857d7e;
  --brand-grey: #b3aaab;
  --accent: #c93a5d;
  --accent-2: #8f1f38;
  --accent-ink: #ffffff;
  --accent-soft: #3a1a22;
  --line-accent: #5a2a35;
  --c-susp: #f2a0b4; --c-adv: #8f4b5a;
  --ok: #6fcf9a; --ok-soft: #16301f;
  --warn: #e8b357; --warn-soft: #37290f;
  --info: #7fb2e5; --info-soft: #162a3b;
  --crit: #f08a82; --crit-soft: #3d1a18;
}
:root[data-tema="escuro"] .top { background: linear-gradient(135deg, #5e1020 0%, #2e0710 100%); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
:root[data-tema="escuro"] .panel, :root[data-tema="escuro"] .kpi, :root[data-tema="escuro"] .side { box-shadow: none; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -0.01em; color: var(--accent); }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.muted { color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.roles { display: grid; gap: 6px; }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 12px; text-align: center; }

.grid2 { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid2.wide-left { grid-template-columns: minmax(0, 1fr) minmax(0, 420px); }
@media (max-width: 860px) { .grid2, .grid2.wide-left { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.list { display: grid; gap: 8px; }
.item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; display: grid; gap: 5px; border-left: 4px solid var(--lvl, var(--line)); }
.item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); border-left-color: var(--lvl); }
.item .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item strong { font-weight: 600; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-coord { background: var(--warn-soft); color: var(--warn); }
.s-dp, .s-conf { background: var(--info-soft); color: var(--info); }
.s-apl { background: var(--accent-soft); color: var(--accent); }
.s-ok { background: var(--ok-soft); color: var(--ok); }
.s-rec { background: var(--crit-soft); color: var(--crit); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--brand-grey); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.lvl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.lvl-0 { --lvl: #8a8a89; } .lvl-1 { --lvl: #d9a032; } .lvl-2 { --lvl: #d4672e; } .lvl-3 { --lvl: #c0262b; }
.lvl-t { color: var(--lvl); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.steps li { font-size: 12px; padding: 8px; border-radius: 8px; background: var(--sunken); color: var(--muted); border-top: 3px solid var(--line); min-width: 0; }
.steps li.done { border-top-color: var(--ok); color: var(--fg); }
.steps li.now { border-top-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.steps b { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }

.suggest { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.suggest .med { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--accent); }
.suggest ul { margin: 0; padding-left: 18px; }
.rc { border: 1px solid var(--line); border-top: 4px solid var(--lvl); border-radius: 12px; background: var(--surface); padding: 18px 20px; display: grid; gap: 14px; }
.rc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.rc-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.rc-badge svg { width: 14px; height: 14px; }
.rc-badge.ok { background: var(--ok-soft); color: var(--ok); }
.rc-badge.warn { background: var(--warn-soft); color: var(--warn); }
.rc-badge.crit { background: var(--crit-soft); color: var(--crit); }
.rc-cont { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.rc-cont b { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--fg); }
.rc-cont small { font-size: 11px; line-height: 1.25; }
.rc-desc { margin: -6px 0 0; font-size: 13.5px; color: var(--muted); }
.rc-cmp { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); align-items: stretch; gap: 0; }
.rc-cmp.igual { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.rc-box { display: grid; gap: 4px; align-content: start; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); }
.rc-box strong { font-family: var(--display); font-size: 17px; line-height: 1.2; color: var(--fg); }
.rc-box small { font-size: 12px; color: var(--muted); }
.rc-cmp.dif .rc-box:first-child strong { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.rc-box.apl { background: var(--accent-soft); border-color: var(--accent); }
.rc-box.apl strong { color: var(--accent); font-size: 19px; }
.rc-k { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rc-seta { display: grid; place-items: center; align-content: center; gap: 2px; color: var(--lvl); }
.rc-seta svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.rc-seta small { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.rc-sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.rc-escada { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rc-escada li { position: relative; display: grid; gap: 2px; padding: 10px 12px 10px 44px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.rc-escada li b { color: inherit; }
.rc-escada li small { font-size: 11.5px; }
.rc-dot { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--sunken); color: var(--muted); }
.rc-escada li.feito { border-style: solid; }
.rc-escada li.feito .rc-dot { background: var(--soft); color: #fff; }
.rc-escada li.atual { border: 1.5px solid var(--lvl); background: var(--surface); color: var(--fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lvl) 14%, transparent); }
.rc-escada li.atual .rc-dot { background: var(--lvl); color: #fff; }
.rc-ant { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rc-ant li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 13px; padding: 7px 10px; border-radius: 8px; background: var(--sunken); }
.rc-ant time { color: var(--muted); font-variant-numeric: tabular-nums; }
.rc-ant span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-outras .rc-ant li { background: var(--info-soft); }
.rc-hl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.rc-hl li { padding: 8px 10px; border-radius: 8px; background: var(--sunken); display: grid; gap: 4px; font-size: 13px; }
.rc-hl-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .rc-hl-top time { color: var(--muted); font-variant-numeric: tabular-nums; } .rc-hl-top span { color: var(--muted); font-size: 12px; margin-left: auto; }
.rc-hl p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.rc-nota { margin: 0; font-size: 12.5px; color: var(--muted); }
.rc-base ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
@media (max-width: 640px) { .rc { padding: 14px; } .rc-cmp, .rc-cmp.igual { grid-template-columns: minmax(0, 1fr); gap: 0; } .rc-seta { padding: 4px 0; } .rc-seta svg { transform: rotate(90deg); } .rc-escada { grid-template-columns: minmax(0, 1fr); } .rc-ant li { grid-template-columns: 82px minmax(0, 1fr); } .rc-ant li b { grid-column: 1 / -1; } }
.note { font-size: 13px; padding: 8px 12px; border-radius: 8px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.crit { background: var(--crit-soft); color: var(--crit); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ai { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

label { display: grid; gap: 5px; font-weight: 500; }
label small { font-weight: 400; color: var(--muted); }
select, input[type="text"], input[type="date"], input[type="number"], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; }
textarea { min-height: 84px; resize: vertical; }
textarea.formal { font-family: var(--serif); font-size: 14px; line-height: 1.6; min-height: 150px; background: var(--paper); color: var(--paper-ink); }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .form-grid, .form-grid.three { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; display: grid; gap: 12px; min-width: 0; }
legend { font-family: var(--display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 6px; }

.desvios { border: 1px solid var(--line); border-radius: 10px; max-height: 300px; overflow-y: auto; }
.desvios .grp { position: sticky; top: 0; background: var(--sunken); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.desvios label { grid-template-columns: auto auto minmax(0, 1fr); display: grid; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-weight: 400; align-items: start; }
.desvios label:hover { background: var(--sunken); }
.desvios .n { font-family: var(--mono); color: var(--muted); font-size: 12px; padding-top: 1px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.timeline li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.timeline time { color: var(--muted); font-family: var(--mono); font-size: 12px; }

/* Documento gerado (sempre papel claro) */
.doc { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-top: 6px solid #711424; border-radius: 6px; padding: 26px 28px; font-family: var(--serif); display: grid; gap: 12px; font-size: 13.5px; line-height: 1.65; }
.doc h4 { margin: 0; font-family: var(--display); text-align: center; font-size: 16px; letter-spacing: 0.1em; font-weight: 900; color: #711424; }
.doc p { margin: 0; text-align: justify; }
.doc .to { font-weight: 600; }
.doc .ph { background: #f5e6e9; color: #711424; border-radius: 3px; padding: 0 4px; font-family: var(--mono); font-size: 12px; }
.doc .fato { background: #fbf3dc; border-radius: 3px; }
.doc .place { text-align: right; }
.doc .sig { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 22px; margin-top: 22px; font-size: 12px; text-align: center; }
.doc .sig span { border-top: 1px solid var(--paper-ink); padding-top: 4px; }
.doc-fig { margin: 4px auto; text-align: center; break-inside: avoid; }
.doc-fig img { display: block; max-width: 100%; max-height: 360px; margin: 0 auto; border: 1px solid #dcd5d7; border-radius: 2px; }
.doc-fig figcaption { margin-top: 4px; font-size: 11px; font-style: italic; color: var(--paper-muted); }
.doc-anexo { break-before: page; display: grid; gap: 12px; border-top: 1px dashed #dcd5d7; padding-top: 16px; margin-top: 8px; }
.doc .ref { font-family: var(--mono); font-size: 11px; color: var(--paper-muted); text-align: right; }
@media (max-width: 480px) { .doc { padding: 18px 16px; } .doc .sig { grid-template-columns: minmax(0, 1fr); } }

.gen { display: grid; gap: 8px; }
.relato-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.btn-mic { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn-mic:hover { background: var(--accent-soft); }
.btn-mic.on { background: var(--accent); color: var(--accent-ink); animation: pulsoMic 1.6s ease-out infinite; }
@keyframes pulsoMic { 0% { box-shadow: 0 0 0 0 rgba(113, 20, 36, .45); } 100% { box-shadow: 0 0 0 14px rgba(113, 20, 36, 0); } }
.mic-status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent); font-weight: 600; margin-top: -6px; }
.mic-status[hidden] { display: none; }
.mic-onda { display: inline-flex; gap: 3px; align-items: center; height: 16px; }
.mic-onda i { width: 3px; height: 100%; background: var(--accent); border-radius: 2px; animation: onda 0.9s ease-in-out infinite; }
.mic-onda i:nth-child(2) { animation-delay: .15s; } .mic-onda i:nth-child(3) { animation-delay: .3s; } .mic-onda i:nth-child(4) { animation-delay: .45s; }
@keyframes onda { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .btn-mic.on, .mic-onda i { animation: none; } }
.fotos-campo { display: grid; gap: 8px; }
.fotos-lbl { display: grid; gap: 2px; } .fotos-lbl small { color: var(--muted); font-size: 12px; }
.fotos-grade { display: flex; flex-wrap: wrap; gap: 10px; }
.foto-th { position: relative; width: 104px; height: 104px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken); padding: 0; cursor: pointer; flex: none; }
.foto-th img, .foto-abrir img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-abrir { border: 0; padding: 0; width: 100%; height: 100%; background: none; cursor: zoom-in; }
.foto-x { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.foto-x:hover { background: var(--crit); }
.foto-add { width: 104px; height: 104px; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 6px; line-height: 1.25; }

.acesso strong { color: var(--accent); }
.acesso ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; }
.sessao-box { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28); border-radius: 10px; padding: 8px 10px 8px 14px; }
.sessao-box strong { display: block; color: #ffffff; font-size: 14px; }
.sessao-box span { color: rgba(255,255,255,0.8); font-size: 12px; }
.top .btn.sair { background: #ffffff; color: var(--accent); border-color: #ffffff; padding: 6px 12px; }

/* Caixa "O que falta" no detalhe da solicitação */
.situ { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); border: 1px solid var(--warn); }
.situ strong { font-size: 16px; color: var(--fg); }
.situ-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.situ-k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); }
.situ-quem { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.situ.ok { background: var(--ok-soft); border-color: var(--ok); } .situ.ok .situ-k { color: var(--ok); }
.situ.rec { background: var(--crit-soft); border-color: var(--crit); } .situ.rec .situ-k { color: var(--crit); }
.steps em { display: block; font-style: normal; font-size: 11px; margin-top: 2px; color: var(--muted); }
.steps li.done em { color: var(--ok); font-weight: 600; }
.steps li.now em { color: var(--accent); font-weight: 700; }

/* Aba "Como usar": passo a passo por perfil e dúvidas frequentes */
.help-intro { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-end; }
.help-intro p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.guide { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: passo; }
.guide li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line); counter-increment: passo; }
.guide li:first-child { border-top: 0; padding-top: 4px; }
.guide li::before { content: counter(passo); grid-row: span 3; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.guide h4 { margin: 0; font-size: 15px; font-weight: 700; }
.guide p { margin: 0; max-width: 68ch; }
.guide .tip { font-size: 13px; color: var(--muted); }
.guide .tip b { color: var(--fg); }
.guide .go { justify-self: start; margin-top: 4px; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 7px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.guide .go:hover { background: var(--accent-soft); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.legend li { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; font-size: 13px; }
@media (max-width: 560px) { .legend li { grid-template-columns: minmax(0, 1fr); } }
.faq-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; }
.faq-head label { flex: 1 1 260px; max-width: 420px; }
.faq-grp { display: grid; gap: 0; }
.faq-grp h3 { padding: 10px 0 6px; }
.faq details { border-top: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: 11px 4px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--accent); font-weight: 700; font-size: 17px; line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq summary:hover { color: var(--accent); }
.faq .ans { padding: 0 4px 13px; max-width: 70ch; color: var(--fg); }
.faq .ans p { margin: 0 0 6px; }
.faq .ans p:last-child { margin: 0; }

/* =====================================================================
   VISUAL 2026 — mesmas cores da CGB (vinho #711424), acabamento moderno:
   fonte Inter, cantos mais suaves, sombras leves, campos e botões maiores,
   menu lateral mais limpo e login em tela dividida com a marca.
   (O documento oficial/PDF continua no modelo da empresa, sem mudança.)
   ===================================================================== */
:root {
  --bg: #f5f3f3;
  --surface: #ffffff;
  --sunken: #f1eeee;
  --line: #e7e2e3;
  --fg: #231f20;
  --muted: #6e6869;
  --soft: #a39d9e;
  --accent-soft: #f8edef;
  --line-accent: #ecd3d9;
  --display: "Inter", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --body: "Inter", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --mono: "Inter", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px;
  --sh-1: 0 1px 2px rgba(35, 31, 32, 0.04), 0 1px 3px rgba(35, 31, 32, 0.05);
  --sh-2: 0 2px 4px rgba(35, 31, 32, 0.04), 0 8px 24px rgba(74, 11, 22, 0.08);
  --sh-3: 0 12px 40px rgba(74, 11, 22, 0.16);
  --ring: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
}
:root[data-tema="escuro"] {
  --bg: #121011; --surface: #1c1819; --sunken: #262122; --line: #352e30;
  --sh-1: none; --sh-2: 0 8px 24px rgba(0, 0, 0, 0.35); --sh-3: 0 12px 40px rgba(0, 0, 0, 0.5);
}

body { font-family: var(--body); font-size: 14.5px; letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
.wrap { max-width: 1280px; gap: 20px; padding-block: 18px 56px; }
h1, h2, h3 { letter-spacing: -0.02em; }
h1 { font-style: normal; font-weight: 800; }
h2 { font-size: 18px; font-weight: 750; }
h3 { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }

/* Aviso do topo: discreto */
.banner { background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-left: 3px solid #d9a032; border-radius: var(--r-sm); padding: 9px 14px; box-shadow: var(--sh-1); }
.banner b { color: var(--fg); }

/* Cabeçalho */
.top { position: relative; z-index: 20; border-radius: var(--r-lg); padding: 14px 18px 14px 22px;
  background: radial-gradient(120% 160% at 100% 0%, #8f2236 0%, transparent 55%), linear-gradient(120deg, #4a0b16 0%, #711424 70%);
  box-shadow: var(--sh-2); }
.top::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 22px); }
.top > * { position: relative; z-index: 1; }
.top h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.top .eyebrow { font-size: 10.5px; letter-spacing: 0.16em; }
.logo-img { height: 40px; }
.marca-txt { border-left-color: rgba(255,255,255,0.22); }
.perfil-chip { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); backdrop-filter: blur(6px); }
.perfil-chip:hover, .perfil-chip[aria-expanded="true"] { background: rgba(255,255,255,0.18); }
.tema-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); }
.perfil-pop { border-radius: var(--r-md); box-shadow: var(--sh-3); padding: 14px; gap: 10px; }

/* Menu lateral */
.app { grid-template-columns: 232px minmax(0, 1fr); gap: 20px; }
.side { border-radius: var(--r-lg); padding: 10px; box-shadow: var(--sh-1); border-color: var(--line); }
.side-grp { font-size: 10px; letter-spacing: 0.14em; color: var(--soft); padding: 14px 12px 6px; }
.side button { position: relative; padding: 9px 12px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; }
.side button:hover { background: var(--sunken); color: var(--fg); }
.side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side button[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.side .count { background: var(--accent); font-weight: 700; font-size: 11.5px; padding: 1px 7px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { border-radius: var(--r-md); }
  .side button[aria-current="page"]::before { display: none; }
}
.app:has(> nav[hidden]) { grid-template-columns: minmax(0, 1fr); }

/* Painéis e cartões */
.panel { border-radius: var(--r-lg); padding: 20px; gap: 16px; border-color: var(--line); box-shadow: var(--sh-1); }
.kpi, .al-card, .base-card, .cc-card, .pend-apl, .al-resumo, .cta-painel, .rc { border-radius: var(--r-lg); box-shadow: var(--sh-1); border-color: var(--line); }
.kpi { padding: 16px 18px; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.kpi-n { font-weight: 800; letter-spacing: -0.03em; font-size: 32px; }
.kpi-acao { background: radial-gradient(120% 140% at 100% 0%, #8f2236 0%, transparent 60%), linear-gradient(135deg, #711424, #4a0b16); border: 0; }
.item, .espera-item, .msg, .al-item, .aten-item, .reinc-item, .mod-op, .rev, .img-item, .anexo, .hist-card { border-radius: var(--r-md); }
.item { padding: 12px 14px; transition: border-color .15s, box-shadow .15s; }
.item:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--sh-1); }
.wiz-hero { border-radius: var(--r-lg); background: radial-gradient(120% 160% at 100% 0%, #8f2236 0%, transparent 55%), linear-gradient(120deg, #4a0b16, #711424 70%); }
.wiz-main { border-radius: var(--r-lg); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: var(--r-sm); font-weight: 650; border-color: var(--line); background: var(--surface); box-shadow: var(--sh-1); transition: background .15s, border-color .15s, box-shadow .15s, transform .05s; }
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #7d1a2c, #711424); border-color: #5e101e; box-shadow: 0 1px 2px rgba(74,11,22,.25), inset 0 1px 0 rgba(255,255,255,.12); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #711424, #5e101e); }
.btn.danger { background: var(--surface); }
.btn.danger:hover:not(:disabled) { background: var(--crit-soft); border-color: var(--crit); }
.btn .ico { margin-right: 0; }
.chip, .dv-kw { padding: 5px 12px; }
.link { font-weight: 650; }

/* Campos */
label { font-weight: 600; font-size: 13.5px; }
select, input[type="text"], input[type="date"], input[type="number"], input[type="password"], textarea {
  width: 100%; min-height: 42px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: var(--r-sm); padding: 10px 12px; font-weight: 400; box-shadow: inset 0 1px 1px rgba(35,31,32,0.03);
  transition: border-color .15s, box-shadow .15s; }
select:hover, input:hover, textarea:hover { border-color: color-mix(in srgb, var(--accent) 25%, var(--line)); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
textarea { min-height: 96px; }
fieldset { border-radius: var(--r-md); padding: 16px; }
.note { border-radius: var(--r-sm); }

/* Selos e tabelas */
.pill { font-weight: 650; padding: 3px 10px; }
.tag { border-radius: 6px; }
th { font-size: 11px; letter-spacing: 0.07em; font-weight: 700; background: var(--sunken); }
th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
td { border-bottom-color: var(--line); }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.toast { border-radius: 12px; box-shadow: var(--sh-3); padding: 12px 18px; }

/* =========================== Login em tela dividida =========================== */
body.tela-login .banner, body.tela-login .top { display: none; }
body.tela-login .wrap { max-width: none; padding: 0; min-height: 100vh; min-height: 100dvh; }
body.tela-login .app, body.tela-login main { display: block; }
.login-split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; background: var(--bg); }
.login-marca { position: relative; overflow: hidden; color: #fff; padding: clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
  background: radial-gradient(90% 70% at 100% 0%, #9b2a3f 0%, transparent 60%), radial-gradient(70% 60% at 0% 100%, #2e0710 0%, transparent 70%), linear-gradient(140deg, #4a0b16 0%, #711424 60%, #7d1a2c 100%); }
.login-marca::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(115deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 26px); }
.login-marca::after { content: ""; position: absolute; width: 520px; height: 520px; right: -180px; bottom: -200px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 0 0 60px rgba(255,255,255,0.025), 0 0 0 140px rgba(255,255,255,0.02); pointer-events: none; }
.login-marca > * { position: relative; z-index: 1; }
.login-logo { height: 52px; width: auto; display: block; align-self: flex-start; object-fit: contain; }
.login-titulo { display: grid; gap: 14px; max-width: 30rem; }
.login-titulo .eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.login-titulo h1 { color: #fff; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; }
.login-titulo p { margin: 0; color: rgba(255,255,255,0.82); font-size: 15.5px; line-height: 1.6; }
.login-itens { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 12px; }
.login-itens li { display: flex; gap: 12px; align-items: flex-start; color: rgba(255,255,255,0.9); font-size: 14px; line-height: 1.45; }
.login-itens svg { flex: none; width: 34px; height: 34px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
  fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.login-itens b { display: block; color: #fff; font-weight: 650; }
.login-rodape { font-size: 12px; color: rgba(255,255,255,0.6); }
.login-lado { display: grid; place-items: center; padding: clamp(24px, 5vw, 64px) clamp(16px, 4vw, 48px); }
.login-caixa { width: min(100%, 400px); display: grid; gap: 22px; }
.login-caixa h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
.login-caixa .sub { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
.login-form { gap: 16px; }
.login-form input { min-height: 46px; font-size: 15px; }
.login-form .btn.primary { width: 100%; min-height: 48px; font-size: 15px; }
.login-form .actions { display: grid; gap: 10px; }
.login-ajuda { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.login-ajuda svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-top: 1px; }
.login-caixa .note { margin: 0; }
@media (max-width: 860px) {
  .login-split { grid-template-columns: minmax(0, 1fr); }
  .login-marca { padding: 22px 18px 26px; gap: 18px; }
  .login-marca::after, .login-itens, .login-rodape { display: none; }
  .login-logo { height: 38px; }
  .login-titulo h1 { font-size: 26px; }
  .login-titulo p { font-size: 14px; }
  .login-lado { place-items: start center; padding-top: 28px; }
}

/* Usuários (DP) */
.usu-senha { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: var(--r-md); }
.usu-senha code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight: 700; color: var(--fg); background: var(--surface); padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--ok); justify-self: start; }


/* ---------- Sombras mais presentes nos cards ---------- */
:root {
  --simbolo: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2096%20143%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Crect%20width%3D%2296%22%20height%3D%22143%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cpath%20clip-path%3D%22url(%23c)%22%20d%3D%22M48.0%201.6%20L70.23%2023.83%20L48.0%2046.07%20L25.77%2023.83Z%20M24.17%2025.43%20L46.4%2047.67%20L24.17%2069.9%20L1.93%2047.67Z%20M0.33%2049.27%20L22.57%2071.5%20L0.33%2093.73%20L-21.9%2071.5Z%20M71.83%2025.43%20L94.07%2047.67%20L71.83%2069.9%20L49.6%2047.67Z%20M24.17%2073.1%20L46.4%2095.33%20L24.17%20117.57%20L1.93%2095.33Z%20M95.67%2049.27%20L117.9%2071.5%20L95.67%2093.73%20L73.43%2071.5Z%20M71.83%2073.1%20L94.07%2095.33%20L71.83%20117.57%20L49.6%2095.33Z%20M48.0%2096.93%20L70.23%20119.17%20L48.0%20141.4%20L25.77%20119.17Z%22%2F%3E%3C%2Fsvg%3E");
  --sh-1: 0 1px 2px rgba(35, 31, 32, 0.06), 0 4px 14px rgba(74, 11, 22, 0.07);
  --sh-2: 0 2px 6px rgba(35, 31, 32, 0.06), 0 14px 34px rgba(74, 11, 22, 0.13);
}
:root[data-tema="escuro"] { --sh-1: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35); --sh-2: 0 2px 6px rgba(0,0,0,0.4), 0 14px 34px rgba(0,0,0,0.55); }
.panel, .kpi, .al-card, .base-card, .cc-card, .pend-apl, .al-resumo, .cta-painel, .rc, .side, .wiz-main,
.item, .espera-item, .msg, .al-item, .aten-item, .reinc-item, .mod-op, .rev, .img-item, .dp-box, .al-grp, .stat, .hist-card, .conta { box-shadow: var(--sh-1); }
.item, .espera-item, .msg, .al-item, .aten-item, .reinc-item, .mod-op, .cta-painel, .kpi { transition: box-shadow .18s, transform .18s, border-color .18s, background .18s; }
.item:hover, .espera-item:hover, .msg:hover, .al-item:hover, .aten-item:hover, .reinc-item:hover, .mod-op:hover, .cta-painel:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.kpi-static:hover { box-shadow: var(--sh-1); transform: none; }
.top, .wiz-hero { box-shadow: 0 4px 10px rgba(74, 11, 22, 0.14), 0 18px 40px rgba(74, 11, 22, 0.20); }
.kpi-acao { box-shadow: 0 6px 18px rgba(74, 11, 22, 0.28); }
.btn.primary { box-shadow: 0 1px 2px rgba(74,11,22,.25), 0 4px 12px rgba(74,11,22,.22), inset 0 1px 0 rgba(255,255,255,.12); }

/* ---------- Marca d'água: só o símbolo da CGB ---------- */
body::before { content: ""; position: fixed; z-index: 0; pointer-events: none;
  width: min(46vw, 440px); aspect-ratio: 96 / 143; right: max(-60px, -4vw); bottom: -70px;
  background: var(--accent); opacity: 0.05;
  -webkit-mask: var(--simbolo) center / contain no-repeat; mask: var(--simbolo) center / contain no-repeat; }
:root[data-tema="escuro"] body::before { background: #ffffff; opacity: 0.035; }
.wrap { position: relative; z-index: 1; }
body.tela-login::before { display: none; }
/* no cabeçalho, símbolo pequeno e discreto atrás do perfil */
.top::before { content: ""; position: absolute; pointer-events: none; z-index: 0; right: 24%; top: -30px; width: 120px; aspect-ratio: 96 / 143;
  background: #ffffff; opacity: 0.06; -webkit-mask: var(--simbolo) center / contain no-repeat; mask: var(--simbolo) center / contain no-repeat; }
@media (max-width: 760px) { .top::before { right: -20px; } }
/* no login, símbolo grande no painel da marca */
.login-marca::after { width: min(62%, 420px); height: auto; aspect-ratio: 96 / 143; right: -6%; bottom: -12%; border: 0; border-radius: 0; box-shadow: none;
  background: #ffffff; opacity: 0.08; -webkit-mask: var(--simbolo) center / contain no-repeat; mask: var(--simbolo) center / contain no-repeat; }
@media (max-width: 860px) { .login-marca::after { display: block; width: 180px; right: -30px; bottom: -60px; } }

/* ---------- Distribuição do espaço ---------- */
.wrap { max-width: 1720px; gap: 16px; padding-block: 14px 40px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.top { padding: 10px 14px 10px 18px; gap: 14px; }
.top h1 { font-size: 18px; }
.top .eyebrow { margin-bottom: 2px; }
.logo-img { height: 34px; }
.marca { gap: 14px; }
.marca-txt { padding-left: 14px; gap: 1px; }
.tema-btn { width: 38px; height: 38px; }
.avatar { width: 32px; height: 32px; font-size: 12px; }
.perfil-chip { padding: 4px 12px 4px 4px; }
.selo-teste { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  background: #f2c14e; color: #3d2a00; vertical-align: 1px; cursor: help; }
.app { grid-template-columns: 216px minmax(0, 1fr); gap: 18px; }
.side { top: 14px; max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow-y: auto; scrollbar-width: thin; }
/* Solicitações: lista à esquerda com rolagem própria, detalhe ocupa o resto */
.grid2 { grid-template-columns: minmax(330px, 440px) minmax(0, 1fr); gap: 16px; }
.grid2 > .panel:first-child { position: sticky; top: 14px; max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow-y: auto; scrollbar-width: thin; align-self: start; }
.chips { gap: 5px; }
.chip { white-space: nowrap; font-size: 12px; padding: 3px 9px; }
.grid2 > .panel:first-child { padding: 14px; gap: 12px; }
.list, .item { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.app { grid-template-columns: 224px minmax(0, 1fr); }
.item .row > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .row > :last-child { flex: none; white-space: nowrap; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .grid2 > .panel:first-child { position: static; max-height: none; overflow: visible; }
  .side { max-height: none; overflow-y: visible; }
}
@media (max-width: 560px) { .selo-teste { display: none; } }
/* Telas médias (notebook com zoom, janela pela metade): lista em cima com rolagem própria, detalhe na largura toda */
.grid2 > * { min-width: 0; }
.steps { overflow-x: auto; scrollbar-width: thin; }
@media (min-width: 861px) and (max-width: 1240px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .grid2 > .panel:first-child { position: static; max-height: 340px; }
}
/* Usuários: modo edição */
.usu-editando { display: grid; gap: 2px; margin-top: 8px; padding: 10px 14px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--line-accent); }
.usu-editando b { color: var(--accent); }
.usu-editando .muted { font-size: 13px; }
.usu-form.editando { padding: 14px; border: 1px dashed var(--line-accent); border-radius: var(--r-md); }
.usu-tab tr.usu-linha-ed td { background: var(--accent-soft); }
.usu-tab td .actions { flex-wrap: wrap; }
.usu-tab td:last-child { min-width: 150px; }
.usu-tab td:first-child { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .btn, .side button, .item, select, input, textarea { transition: none; } }
</style>

<script>
const HOJE = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const diaMenos = n => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const diaMais = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const dataValida = v => /^\d{4}-\d{2}-\d{2}$/.test(v || "") && v >= "2000-01-01" && v <= HOJE;
// ---------- Fotos da ocorrência ----------
const MAX_FOTOS = 6;
function gradeFotos(f) {
  const fs = f.fotos || [];
  return fs.map((x, k) => `<div class="foto-th"><button type="button" class="foto-abrir" data-act="foto-ver" data-fonte="form" data-k="${k}"><img src="${x.url}" alt="Foto ${k + 1} da ocorrência"></button><button type="button" class="foto-x" data-act="foto-rem" data-k="${k}" aria-label="Remover foto ${k + 1}">×</button></div>`).join("")
    + (fs.length < MAX_FOTOS ? `<label class="foto-add" for="f-camera"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Tirar foto</span><input type="file" id="f-camera" accept="image/*" capture="environment" hidden></label>
       <label class="foto-add" for="f-fotos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/></svg><span>Escolher da galeria</span><input type="file" id="f-fotos" accept="image/*" multiple hidden></label>` : "");
}
function atualizarFotos() { const g = document.getElementById("fotos-grade"); if (g && state.form) g.innerHTML = gradeFotos(state.form); }
function reduzirFoto(file, m = 1280, q = 0.72) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", q)); };
    img.onerror = () => { URL.revokeObjectURL(url); erro(); }; img.src = url;
  });
}
async function addFotos(files) {
  const f = state.form; if (!f || !files || !files.length) return; f.fotos = f.fotos || [];
  const lista = [...files].filter(x => /^image\//.test(x.type)), vagas = MAX_FOTOS - f.fotos.length;
  if (lista.length < files.length) toast("Só imagens são aceitas aqui (JPG, PNG, foto do celular).");
  if (lista.length > vagas) toast(`Limite de ${MAX_FOTOS} fotos. Foram adicionadas ${Math.max(0, vagas)}.`);
  for (const x of lista.slice(0, Math.max(0, vagas))) { try { f.fotos.push({ nome: x.name, url: await reduzirFoto(x) }); } catch { toast(`Não consegui abrir ${x.name}.`); } }
  atualizarFotos(); agendarRascunho();
}
const LB = { lista: [], k: 0 };
function verFoto(lista, k) {
  if (!lista.length) return; LB.lista = lista; LB.k = (k + lista.length) % lista.length;
  let lb = document.getElementById("lightbox"); if (!lb) { lb = document.createElement("div"); lb.id = "lightbox"; lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", "Foto da ocorrência"); document.body.appendChild(lb); }
  lb.innerHTML = `<button type="button" class="lb-fundo" data-act="foto-fechar" aria-label="Fechar"></button><figure><img src="${lista[LB.k].url}" alt="Foto ${LB.k + 1} de ${lista.length}"><figcaption>Foto ${LB.k + 1} de ${lista.length}</figcaption></figure>
    <button type="button" class="lb-x" data-act="foto-fechar" aria-label="Fechar">×</button>${lista.length > 1 ? `<button type="button" class="lb-nav l" data-act="foto-nav" data-d="-1" aria-label="Foto anterior">‹</button><button type="button" class="lb-nav r" data-act="foto-nav" data-d="1" aria-label="Próxima foto">›</button>` : ""}`;
}
document.addEventListener("keydown", e => { const lb = document.getElementById("lightbox"); if (!lb) return; if (e.key === "Escape") lb.remove(); if (e.key === "ArrowLeft") verFoto(LB.lista, LB.k - 1); if (e.key === "ArrowRight") verFoto(LB.lista, LB.k + 1); });

// ---------- Ditado do relato (reconhecimento de voz do navegador) ----------
const DITADO = { on: false, rec: null, base: "" };
function iniciarDitado() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Este navegador não tem ditado. No celular, toque no microfone do teclado para ditar."); return; }
  const ta = document.getElementById("f-relato"); if (!ta || !state.form) return;
  let rec; try { rec = new SR(); } catch { toast("Não foi possível iniciar o ditado aqui. Use o microfone do teclado do celular."); return; }
  rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  DITADO.base = ta.value.trim(); DITADO.rec = rec; DITADO.on = true; marcarMic();
  rec.onresult = ev => {
    let fim = "", parcial = "";
    for (let k = ev.resultIndex; k < ev.results.length; k++) { const t = ev.results[k][0].transcript; if (ev.results[k].isFinal) fim += t; else parcial += t; }
    if (fim) DITADO.base = (DITADO.base ? DITADO.base + " " : "") + fim.trim();
    const v = (DITADO.base + (parcial ? " " + parcial.trim() : "")).trim(), t = document.getElementById("f-relato");
    state.form.relato = DITADO.base; if (t) { t.value = v; t.scrollTop = t.scrollHeight; }
    const st = document.getElementById("mic-txt"); if (st) st.textContent = parcial ? "Ouvindo…" : "Ouvindo… pode continuar falando";
    renderTextoBotoes(); agendarRascunho();
  };
  rec.onerror = ev => {
    const m = { "not-allowed": "O microfone foi bloqueado. Libere o microfone para esta página ou use o microfone do teclado do celular.", "service-not-allowed": "O ditado não está liberado nesta visualização. Use o microfone do teclado do celular.", "no-speech": "Não ouvi nada. Toque em Ditar relato e fale de novo.", "audio-capture": "Nenhum microfone encontrado.", "network": "O ditado precisa de internet." }[ev.error];
    if (m) toast(m); if (ev.error !== "no-speech") pararDitado();
  };
  rec.onend = () => { if (DITADO.on && DITADO.rec === rec) { try { rec.start(); } catch { pararDitado(); } } };
  try { rec.start(); } catch { pararDitado(); toast("Não foi possível iniciar o ditado aqui. Use o microfone do teclado do celular."); }
}
function pararDitado() {
  const rec = DITADO.rec; DITADO.on = false; DITADO.rec = null; if (rec) { try { rec.stop(); } catch {} }
  if (state.form) { const t = document.getElementById("f-relato"); if (t) { state.form.relato = t.value; renderTextoBotoes(); } }
  marcarMic(); agendarRascunho();
}
function marcarMic() {
  const b = document.getElementById("btn-mic"), st = document.getElementById("mic-status"); if (!b) return;
  b.classList.toggle("on", DITADO.on); b.setAttribute("aria-pressed", DITADO.on); b.querySelector("span").textContent = DITADO.on ? "Parar de ditar" : "Ditar relato";
  if (st) st.hidden = !DITADO.on;
}

// ---------- Rascunho automático (fica só neste navegador) ----------
const chaveRasc = () => `cgb-rascunho-${state.role}${state.user ? "-" + (state.user.k || state.user.nome || "") : ""}`;
let rascTimer = null;
function agendarRascunho() { clearTimeout(rascTimer); rascTimer = setTimeout(salvarRascunho, 500); }
function salvarRascunho() {
  const f = state.form, st = document.getElementById("rasc-st"); if (!f || state.tab !== "nova") return;
  const vazio = !f.colab && !f.relato.trim() && !f.desvios.length && !(f.fotos || []).length && !f.local && !f.placa && !f.procedimento;
  if (vazio) { apagarRascunho(); if (st) st.textContent = ""; return; }
  const { gerando, dvAberto, restaurado, ...dados } = f, agora = new Date(), quando = `${String(agora.getDate()).padStart(2, "0")}/${String(agora.getMonth() + 1).padStart(2, "0")} às ${String(agora.getHours()).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;
  let semFotos = false;

function montarHistorico(lista) {
  const porChapa = new Map(COLABS.map(c => [c.mat, c.id]));
  lista.forEach(([chapa, data, item, itemTxt, medida, dias, o, docPend, conta, motivo], i) => {
    const colab = porChapa.get(chapa); if (!colab) return;
    REG.push({ id: 100001 + i, imp: true, colab, data, desvios: item ? [item] : [], itemTxt: itemTxt || "", nivel: item ? desvio(item).nivel : 0, medida, sugerida: medida, dias: dias || 0,
      status: "concluida", origem: o, naoConta: !conta, docPend: !!docPend, relato: motivo || "", texto: motivo || "",
      hist: [H(data, `Importado da planilha ${o === "ponto" ? "Medidas PONTO" : "CONTROLE"}`, "Sistema")] });
  });
}

function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function fmt(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; }

function porExtensoData(d) { const [y, m, dd] = d.split("-"); return `${dd} de ${MESES[+m - 1]} de ${y}`; }
const UNI = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
function extenso(n) { n = Math.max(0, Math.floor(+n || 0)); if (n < 20) return UNI[n] || String(n); if (n > 99) return String(n); const d = Math.floor(n / 10), u = n % 10, D = { 2: "vinte", 3: "trinta", 4: "quarenta", 5: "cinquenta", 6: "sessenta", 7: "setenta", 8: "oitenta", 9: "noventa" }[d]; return u ? `${D} e ${UNI[u]}` : D; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Regras 5.1.1, 5.2 e 5.3 da política
function sugerir(colabId, desvioNums, dataRef, excluirId) {
  if (!colabId || !desvioNums.length) return null;
  const lista = desvioNums.map(desvio).sort((a, b) => b.nivel - a.nivel);
  const principal = lista[0];
  const regras = [];
  if (lista.length > 1) regras.push(`5.2 Desvios cumulativos: vale o de maior gravidade (item ${principal.n}, ${NIVEIS[principal.nivel]}), com uma única medida.`);
  // Só medidas registradas no sistema contam para a sugestão. O histórico das planilhas é só consulta.
  const anteriores = REG.filter(r => !r.imp && r.colab === colabId && r.id !== excluirId && !anulada(r) && !r.naoConta && r.desvios.includes(principal.n)
    && diasEntre(r.data, dataRef) >= 0 && diasEntre(r.data, dataRef) <= 365);
  const qtd = anteriores.length;
  let nivel = principal.nivel, medida;
  if (qtd >= 2) {
    nivel = Math.min(principal.nivel + 1, 3);
    medida = MEDIDA[nivel].reinc;
    regras.push(`5.3 Reincidência: ${qtd} ocorrências do item ${principal.n} nos últimos 12 meses. O desvio sobe para ${NIVEIS[nivel]} e recebe a penalidade de reincidência.`);
  } else if (qtd === 1) {
    medida = MEDIDA[nivel].reinc;
    regras.push(principal.nivel === 0
      ? `5.1.1 Reincidência em desvio Leve (1 ocorrência anterior em 12 meses): passa a ser tratado como Média.`
      : `5.1.1 Reincidência (1 ocorrência anterior em 12 meses): penalidade dobrada.`);
    if (principal.nivel === 0) nivel = 1;
  } else {
    medida = MEDIDA[nivel].base;
    regras.push(`5.1.1 Primeira ocorrência do item ${principal.n} em 12 meses: medida padrão para desvio ${NIVEIS[principal.nivel]}.`);
  }
  const al = alineaPadrao(principal.n);
  regras.push(`Enquadramento sugerido: art. 482, alínea "${al}", da CLT (${enquadra(principal.n, al).ato.toLowerCase()}).`);
  const etapa = qtd >= 2 ? 2 : qtd;
  const historico = REG.filter(r => r.imp && r.colab === colabId).sort((a, b) => b.data.localeCompare(a.data));
  const outras = REG.filter(r => !r.imp && r.colab === colabId && r.id !== excluirId && !anulada(r) && !r.naoConta && !r.desvios.includes(principal.n)
    && diasEntre(r.data, dataRef) >= 0 && diasEntre(r.data, dataRef) <= 365);
  return { nivel, medida, regras, anteriores, outras, historico, principal, qtd, etapa, padrao: MEDIDA[principal.nivel].base, nivelOrig: principal.nivel };
}

      ${agr ? `<div class="rc-seta" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg><small>${s.etapa === 2 ? "+1 nível" : "dobra"}</small></div>` : ""}
      <div class="rc-box apl"><span class="rc-k">${agr ? "Medida a aplicar" : "Medida a aplicar · igual à padrão"}</span><strong>${esc(s.medida)}</strong><small>Desvio ${NIVEIS[s.nivel].toLowerCase()}${agr ? ` · regra ${s.etapa === 2 ? "5.3" : "5.1.1"}` : ""}</small></div>

    <div class="rc-sec rc-base"><span class="rc-k">Base</span><ul>${s.regras.filter(t => t !== legal).map(t => `<li>${esc(t)}</li>`).join("")}${legal ? `<li>${esc(legal)}</li>` : ""}</ul></div>
  </div>`;
}

function barras(rows, opts = {}) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hbars">${rows.map(r => `<${r.acao ? "button" : "div"} class="hbar"${r.acao || ""} title="${esc(r.dica || `${r.rot}: ${r.v}`)}">

    <span class="hbar-v">${r.v.toLocaleString("pt-BR")}</span></${r.acao ? "button" : "div"}>`).join("")}</div>`;
}
function colunasMes(vals, rotulos) {
  const W = 560, H = 190, pl = 34, pb = 26, pt = 14, pr = 6;
  const max = Math.max(1, ...vals), passo = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const top = Math.ceil(max / passo) * passo, ticks = [];
  for (let t = 0; t <= top; t += passo) ticks.push(t);
  const y = v => pt + (H - pt - pb) * (1 - v / top), bw = (W - pl - pr) / vals.length;
  return `<svg class="cols" viewBox="0 0 ${W} ${H}" role="img" aria-label="Medidas por mês nos últimos 12 meses">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl - 6}" y="${y(t) + 4}" class="ax" text-anchor="end">${t}</text>`).join("")}
    ${vals.map((v, i) => { const x = pl + i * bw + bw * 0.18, w = bw * 0.64, yy = y(v), hh = Math.max(0, H - pb - yy);
      return `<g class="col"><title>${rotulos[i]}: ${v} medida${v === 1 ? "" : "s"}</title><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" class="hit"/>
        ${hh > 0 ? `<path d="M${x},${H - pb} V${yy + Math.min(4, hh)} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${H - pb} Z" class="bar"/>` : ""}
        <text x="${x + w / 2}" y="${H - 8}" class="ax" text-anchor="middle">${rotulos[i]}</text>
        ${i === vals.length - 1 || v === max ? `<text x="${x + w / 2}" y="${yy - 5}" class="val" text-anchor="middle">${v}</text>` : ""}</g>`; }).join("")}
  </svg>`;
}

    for (let dd = 1; dd <= ate; dd++) { const pref = `${p}-${String(dd).padStart(2, "0")}`, l = lista.filter(r => r.data === pref), s = l.filter(r => ehSusp(r.medida)).length; rotulos.push(String(dd)); sus.push(s); adv.push(l.length - s); }
  } else if (/^\d{4}$/.test(p)) {
    const y = +p, ate = p === HOJE.slice(0, 4) ? +HOJE.slice(5, 7) : 12;
    for (let m = 1; m <= ate; m++) { const pref = `${p}-${String(m).padStart(2, "0")}`, l = lista.filter(r => r.data.startsWith(pref)), s = l.filter(r => ehSusp(r.medida)).length; rotulos.push(MES_CURTO[m - 1]); sus.push(s); adv.push(l.length - s); }
  } else {

      const l = lista.filter(r => r.data.startsWith(pref)); rotulos.push(MES_CURTO[d.getMonth()]); const s = l.filter(r => ehSusp(r.medida)).length; sus.push(s); adv.push(l.length - s); }

  const niveis = NIVEIS.map((nv, i) => ({ rot: nv, v: lista.filter(r => r.desvios.length && desvio(r.desvios[0]).nivel === i).length, cor: COR_NIVEL[i] }));

    susp: susp.length, totalDias, mediaDias: diasConhecidos.length ? totalDias / diasConhecidos.length : 0, docPend,

const pct = v => `${v.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`;

        ${bar(x, H - pb, ya, COR_ADV, !s[i])}${bar(x, ya - (s[i] && a[i] ? 2 : 0), ys, COR_SUSP, true)}

// ---------- Atualização automática ----------
// A cada minuto (com a aba visível) a tela busca a lista leve de solicitações e traz o que outras pessoas fizeram.
// Se você estiver digitando ou com um formulário aberto, a tela espera para redesenhar.
const VERSOES = {}; let atualizTimer = null, redesenharDepois = false;
function iniciarAtualizacao() {
  if (!LOGIN_ATIVO || atualizTimer) return;
  atualizTimer = setInterval(() => { if (!document.hidden) atualizarSolicitacoes(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) atualizarSolicitacoes(); });
}
function podeRedesenhar() {
  if (state.tab === "nova" || state.cancelando || !state.user || state.user.trocarSenha) return false;
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  return ![...document.querySelectorAll("#view textarea, #view input:not([type]), #view input[type=text], #view input[type=date]")].some(x => x.value !== x.defaultValue);

async function atualizarSolicitacoes() {
  if (!state.user || state.user.trocarSenha || atualizarSolicitacoes.rodando) return;
  atualizarSolicitacoes.rodando = true;
  try {
    const { solicitacoes } = await api("/api/solicitacoes");
    const porChapa = new Map(COLABS.map(c => [c.mat, c.id]));
    let novas = 0, mudou = false;
    for (const s of solicitacoes) {
      if (VERSOES[s.id] === s.versao) continue;
      VERSOES[s.id] = s.versao;
      const colabId = porChapa.get(s.chapa); if (!colabId || !s.dados) continue;
      const r = REG.find(x => x.id === s.id && !x.imp);
      const novo = { ...s.dados, id: s.id, colab: colabId, hist: s.dados.hist || [], fotos: [], imagens: [], nFotos: s.nf, nImgs: s.ni, parcial: !!(s.nf || s.ni) };
      if (!r) { REG.push(novo); novas++; mudou = true; continue; }
      if (r === edPend) continue; // o DP está editando esta agora: a versão dele vale
      const igual = JSON.stringify(paraBanco({ ...r, parcial: true })) === JSON.stringify(paraBanco({ ...novo, parcial: true }));
      if (igual) continue; // é a mesma coisa que já está na tela (por exemplo, o que você acabou de salvar)
      Object.keys(r).forEach(k => delete r[k]); Object.assign(r, novo); mudou = true;
    }
    if (novas) toast(novas === 1 ? "Chegou 1 solicitação nova." : `Chegaram ${novas} solicitações novas.`);
    if (mudou || redesenharDepois) {
      if (podeRedesenhar()) { redesenharDepois = false; const y = window.scrollY; render(); window.scrollTo(0, y); }
      else redesenharDepois = true;
    }
  } catch {} finally { atualizarSolicitacoes.rodando = false; }
}

// Prazo e ciclo (só medidas que passaram pelo sistema): do ocorrido/solicitação até a aplicação

async function receberBase(input) {
  const k = input.dataset.base, f = input.files[0]; input.value = ""; if (!f) return;
  toast("Lendo a planilha…");
  try { const r = TIPOS_BASE[k].proc(await lerPlanilha(f)); state.basePrev = { tipo: k, arquivo: f.name, ...r }; }
  catch (e) { state.basePrev = { tipo: k, arquivo: f.name, erro: e && e.message ? e.message : "Não consegui ler esse arquivo." }; }
  render();
}
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.base) receberBase(e.target); });
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-act^='bases-']"); if (!b) return;

function situacao(r) {

// Palavras-chave que levam aos itens do Anexo I (além da busca pelo texto e pelo número)
const DV_CHAVES = {
  "EPI": [18, 35], "Ponto e jornada": [8, 9], "Falta": [1, 16], "Velocidade": [10, 26], "Trânsito e veículo": [9, 13, 19, 30, 37, 38],
  "Procedimento": [2, 17, 24, 25, 27, 43, 44], "Crachá": [4], "DDS": [6], "Celular": [15], "Conduta": [5, 11, 12, 14, 20, 21, 39, 46, 47],
  "Materiais": [3, 29, 31, 36], "Sistemas e documentos": [7, 32, 33, 34], "Segurança": [17, 18, 22, 25, 28, 35, 40, 41, 42, 45]
};
const semAcento = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function buscaDesvios(termo) {
  const t = semAcento(termo); if (!t) return DESVIOS;
  const chave = Object.keys(DV_CHAVES).find(k => semAcento(k) === t);
  if (chave) return DV_CHAVES[chave].map(desvio);
  return DESVIOS.filter(d => String(d.n) === t || semAcento(d.t).includes(t) || Object.entries(DV_CHAVES).some(([k, ns]) => semAcento(k).includes(t) && ns.includes(d.n)));
}
function sugestoesDesvio(f) {
  const lista = buscaDesvios(f.dvTermo || "");
  if (!lista.length) return `<div class="dv-vazio">Nenhum desvio encontrado. Tente outra palavra.</div>`;
  return NIVEIS.map((nv, i) => { const it = lista.filter(d => d.nivel === i); if (!it.length) return "";
    return `<div class="dv-grp lvl-${i}"><span class="lvl lvl-t">${nv}</span></div>` + it.map(d => { const ja = f.desvios.includes(d.n);
      return `<button type="button" class="dv-op ${ja ? "ja" : ""}" role="option" aria-selected="${ja}" data-adddv="${d.n}"><span class="n">${d.n}</span><span>${esc(d.t)}</span>${ja ? `<span class="dv-ok">✓ escolhido</span>` : ""}</button>`; }).join(""); }).join("");
}
function selecionadosDesvio(f) {
  if (!f.desvios.length) return `<div class="dv-nenhum">Nenhum desvio escolhido.</div>`;
  return f.desvios.map(desvio).sort((a, b) => b.nivel - a.nivel).map(d => `<span class="dv-chip lvl-${d.nivel}"><b>${d.n}</b> ${esc(d.t)} <span class="lvl lvl-t">${NIVEIS[d.nivel]}</span><button type="button" data-rmdv="${d.n}" aria-label="Remover item ${d.n}">×</button></span>`).join("");
}
function atualizarDesvios(foco) {
  const f = state.form, s = document.getElementById("dv-sug"), sel = document.getElementById("dv-sel"), inp = document.getElementById("f-busca");
  if (!f || !s) return;
  s.hidden = !f.dvAberto; s.innerHTML = sugestoesDesvio(f); sel.innerHTML = selecionadosDesvio(f);
  if (inp) { inp.setAttribute("aria-expanded", !!f.dvAberto); if (inp.value !== (f.dvTermo || "")) inp.value = f.dvTermo || ""; if (foco) inp.focus(); }
  document.querySelectorAll("[data-dvkw]").forEach(b => b.classList.toggle("on", b.dataset.dvkw === f.dvTermo));
  renderTextoBotoes(); atualizarSugestaoForm();
}

function listaDesvios(f, termo = "") {
  const t = termo.trim().toLowerCase();
  return NIVEIS.map((nv, i) => {
    const itens = DESVIOS.filter(d => d.nivel === i && (!t || d.t.toLowerCase().includes(t) || String(d.n) === t));
    if (!itens.length) return "";

function textoPadrao(f) {

  let core = pd.texto.replace("{local}", f.local.trim() ? ` (ponto de referência: ${f.local.trim()})` : "").replace("{placa}", f.placa.trim() ? ` de placa ${f.placa.trim().toUpperCase()}` : "");
  return `Em ${fmt(f.data)}, ${core.startsWith("foi ") ? "" : "V.Sa. "}${core}`;
}
function textoModelo(f) {
  const p = principalDe(f.desvios);
  if (catDe(f)) {
    let rel = f.relato.trim().replace(/\s+/g, " ").replace(/[.;]+$/, "");
    return `${textoPadrao(f)}.`;
  }
  let rel = f.relato.trim().replace(/\s+/g, " ").replace(/[.;]+$/, "");
  rel = rel.charAt(0).toLowerCase() + rel.slice(1);
  const extras = [f.local && `no ponto de referência ${f.local}`, f.placa && `com o veículo de placa ${f.placa.toUpperCase()}`].filter(Boolean).join(", ");
  return `Em ${fmt(f.data)}${extras ? ", " + extras : ""}, V.Sa. ${rel}.`;

function promptIA(f) {

  return `Você redige o parágrafo que descreve o fato em um documento disciplinar trabalhista no Brasil (advertência ou suspensão). Reescreva o relato do supervisor em português formal e objetivo.

Regras obrigatórias:
- Comece exatamente com "Em ${fmt(f.data)}," (a data do ocorrido).
- Refira-se ao colaborador apenas como "V.Sa.". Nunca use nomes de pessoas.
- Use somente as informações fornecidas abaixo. Não invente fatos, horários, números, testemunhas nem consequências.
- Sem adjetivos, opiniões ou julgamentos: descreva apenas o que foi constatado.
- Uma ou duas frases curtas, no máximo 70 palavras.
- Se houver ponto de referência ou placa informados, inclua-os. Ignore campos marcados como "não informado".
- Descreva só o fato e termine nele. Não cite itens do Anexo I, a política, a CLT nem a medida aplicada: isso já está em outras partes do documento.
- Exemplo do formato esperado: "Em ${fmt(f.data)}, V.Sa. deixou de comparecer às suas atividades laborais sem apresentar qualquer justificativa."
- Responda apenas com o parágrafo, sem título, aspas ou comentários.
${catDe(f) ? `- Use como base o modelo de redação que a empresa já usa para este tipo de situação e só complete com detalhe do relato se ele for essencial: "${textoPadrao(f)}."\n` : ""}

Data do ocorrido: ${fmt(f.data)}
Ponto de referência do local: ${f.local.trim() || "não informado"}
Veículo/placa: ${f.placa.trim() || "não informado"}
Desvio(s) do Anexo I: ${nums.map(n => `item ${n} – ${desvio(n).t}`).join("; ")}
Relato do supervisor: ${f.relato.trim()}`;
}

function limparTexto(t, f) {

  if (!s.includes(fmt(f.data))) s = `Em ${fmt(f.data)}, ` + s.charAt(0).toLowerCase() + s.slice(1);

}

async function gerarTexto() {
  const f = state.form, st = document.getElementById("gen-status");
  f.confirmado = false;
  if (!SAMPLE) {
    f.texto = textoModelo(f); f.origem = "modelo"; renderTexto(); atualizarSugestaoForm();
    st.textContent = "IA indisponível aqui. Usei o modelo simples.";
    return;
  }
  f.gerando = true; f.texto = ""; f.origem = "ia"; renderTexto();
  st.textContent = "Redigindo…";
  ctl = new AbortController();
  try {
    const { text } = await SAMPLE(promptIA(f), {
      modelTier: "quick", cache: false, signal: ctl.signal,
      onText: ({ text }) => { const ta = document.getElementById("f-texto"); if (ta) ta.value = text; }
    });
    f.texto = limparTexto(text, f);
    st.textContent = "Pronto. Confira o texto abaixo.";
  } catch (e) {
    if (e.code === "cancelled") { f.texto = e.text ? limparTexto(e.text, f) : ""; st.textContent = "Geração interrompida."; }
    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) {
      SAMPLE = null; f.texto = textoModelo(f); f.origem = "modelo"; st.textContent = "A IA não foi liberada. Usei o modelo simples.";
    } else if (e.code === "rate_limited") { f.texto = e.text || ""; st.textContent = "Muitos pedidos seguidos. Tente de novo em alguns minutos."; }
    else if (e.code === "refused") { f.texto = ""; st.textContent = "A IA não redigiu este relato. Reescreva o relato e tente de novo."; }
    else { f.texto = e.text ? limparTexto(e.text, f) : ""; st.textContent = "Não foi possível gerar agora. Tente de novo."; }
  } finally {
    f.gerando = false; renderTexto(); atualizarSugestaoForm();
  }
}

function problemasEnvio(f) {

async function salvar(filename, data) {

function csv(rows) { const ks = Object.keys(rows[0] || {}); const q = v => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

function filtrarFaq(termo) {
  const t = termo.trim().toLowerCase(); let total = 0;
  document.querySelectorAll(".faq-grp").forEach(g => {
    let vis = 0;
    g.querySelectorAll("details").forEach(d => { const ok = !t || d.textContent.toLowerCase().includes(t); d.hidden = !ok; d.open = !!t && ok; if (ok) vis++; });
    g.hidden = !vis; total += vis;
  });
  const v = document.getElementById("faq-vazio"); if (v) v.hidden = total > 0;
}
document.addEventListener("input", e => { if (e.target.id === "ajuda-busca") filtrarFaq(e.target.value); });

function aplicarTema(t) {
  document.documentElement.setAttribute("data-tema", t);
  const b = document.getElementById("tema-btn");
  if (b) { const esc = t === "escuro"; b.setAttribute("aria-label", esc ? "Mudar para o tema claro" : "Mudar para o tema escuro"); b.title = esc ? "Tema claro" : "Tema escuro"; }
}
(() => { let t = "claro"; try { t = localStorage.getItem("tema-medidas") || "claro"; } catch {} aplicarTema(t); })();

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }
function add(r, a) { r.hist.push(H(HOJE, a, ROLE_NOME[state.role])); }
function avisoDP(r) {
  const box = document.getElementById("dp-aviso"); if (!box) return [];
  const p = [];
  if (ehPontoManual(r)) { const ds = datasPM(r); if (!(r.datasPM || [r.data]).length) p.push("Informe ao menos uma data da marcação manual (dd/mm/aaaa)."); if (ds.some(d => d > HOJE)) p.push("Há data da marcação manual no futuro."); }
  else if (!r.texto.includes(fmt(r.data))) p.push(`O texto precisa citar a data do ocorrido (${fmt(r.data)}).`);
  if (ehSusp(r.medida)) {
    const dm = diasDaMedida(r.medida), d = +r.dias;
    if (!(d >= 1 && d <= 30)) p.push("Informe de 1 a 30 dias de suspensão.");
    else if (dm && d > dm.max) p.push(`A medida aprovada prevê no máximo ${dm.max} dias.`);
    if (!r.inicio || r.inicio < r.data) p.push("A suspensão precisa começar depois da data do ocorrido.");
  }
  box.innerHTML = p.length ? `<div class="note warn">${p.join(" ")}</div>` : "";
  return p;
}

async function iniciar() {
  const v = document.getElementById("view");

    const re = await fetch("/api/eu", { cache: "no-store" });
    if (re.status === 401) { state.user = null; render(); return; }
    if (!re.ok) throw new Error("HTTP " + re.status);
    const eu = await re.json();
    state.user = { id: eu.usuario, uid: eu.id, k: eu.usuario, nome: eu.nome, role: eu.perfil, bases: "todas", chave: eu.chave, trocarSenha: eu.trocar_senha };

      FROTA.splice(0, FROTA.length, ...(ref.frota || []).map(v => [v.placa, v.modelo || "", v.tipo || "", v.base || "", v.prefixo || ""])); }
    indexarCidades();
    Object.assign(GESTORES, d.gestores || {});
    montarColabs(d.colaboradores || []);
    reaplicarEquipes();
    montarHistorico(d.historico || []);
    montarSolicitacoes(d.solicitacoes || []);
    limparDadosLocais(chaveRasc());
    iniciarAtualizacao();
  } catch (e) {
    console.error(e);
    v.innerHTML = `<section class="panel"><h2>Não foi possível carregar os dados</h2><p class="muted" style="margin:0">O site não conseguiu falar com o servidor (${esc(e.message)}). Confira a conexão e recarregue a página. Se continuar, avise o responsável pelo sistema.</p><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div></section>`;
