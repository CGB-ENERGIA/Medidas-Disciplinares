function colChart(items,o={}){

    (it.meta?'<line class="cc-meta" x1="'+(cx-w/2-6)+'" x2="'+(cx+w/2+6)+'" y1="'+(pt+ih-ih*it.meta/mx)+'" y2="'+(pt+ih-ih*it.meta/mx)+'"/>':'')+

let railAberto=null;
function renderRail(){
  const atual=pag();if(railAberto===null)railAberto=atual.g;
  const item=p=>'<a href="#'+p.id+'" title="'+p.nm+'"'+(atual.id===p.id?' aria-current="page"':'')+'><span class="mi">'+ico(p.ic)+'</span><span class="rt"><b>'+p.nm+'</b><small>'+p.sub+'</small></span>'+(p.id==='qualidade'&&nPend()?'<span class="count">'+nPend()+'</span>':'')+'</a>';
  const grupos=[];for(const p of PAGS()){let g=grupos.find(x=>x.g===p.g);if(!g)grupos.push(g={g:p.g,ps:[]});g.ps.push(p)}
  let h='<div class="rail-lista">';
  for(const g of grupos){
    const ab=railAberto===g.g,temAtual=g.ps.some(p=>p.id===atual.id);
    h+='<div class="mg'+(ab?' aberto':'')+(temAtual?' cur':'')+'"><button type="button" class="mg-hd" data-mg="'+g.g+'" aria-expanded="'+ab+'" title="'+g.g+'"><span class="mi">'+ico(GRUPO_ICO[g.g])+'</span><span class="rt"><b>'+g.g+'</b><small>'+(GRUPO_SUB[g.g]||'')+'</small></span><svg class="mg-sv" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="mg-it"'+(ab?'':' hidden')+'>'+(g.g!=='Hospedagem / Alimentação'?g.ps.map(item).join(''):tx(g.ps.map(item).join('')))+'</div></div>';
  }
  const pin=document.body.classList.contains('rail-pin');
  h+='<div class="rail-foot"><small>Fontes</small><div class="fontes">'+Object.keys(BASES).map(b=>'<span class="fonte'+(FONTE[b]?'':' off')+'" title="'+(FONTE[b]?bnome(b)+' · '+FONTE[b].origem+' em '+FONTE[b].at:'sem dados')+'">'+b+'</span>').join('')+'</div></div></div><button type="button" class="rail-pinb" id="b-railpin" aria-pressed="'+pin+'"><span class="mi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(pin?'M17 6l-6 6 6 6M7 5v14':'M7 6l6 6-6 6M17 5v14')+'"/></svg></span><span class="rt"><b>'+(pin?'Recolher menu':'Manter menu aberto')+'</b><small>'+(pin?'Mostra só os ícones':'Deixa os nomes sempre visíveis')+'</small></span></button>';
  $('rail').innerHTML=h;
  $('rail').querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{const g=b.dataset.mg;const comp=railCompacto();railAberto=comp?g:(railAberto===g?'':g);if(comp)document.body.classList.add('rail-peek');renderRail()});
  $('b-railpin').onclick=()=>{const on=document.body.classList.toggle('rail-pin');document.body.classList.remove('rail-peek');try{localStorage.setItem('rail.pin',on?'1':'0')}catch(e){}renderRail()};
  $('rail').querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('rail-peek')));
}
const railDesk=()=>!matchMedia('(max-width:1000px)').matches;
const railCompacto=()=>railDesk()&&!document.body.classList.contains('rail-pin')&&!document.body.classList.contains('rail-peek');
(function(){try{if(localStorage.getItem('rail.pin')==='1')document.body.classList.add('rail-pin')}catch(e){}
  const r=$('rail');let t=null;
  r.addEventListener('mouseenter',()=>{if(!railDesk()||document.body.classList.contains('rail-pin'))return;clearTimeout(t);t=setTimeout(()=>document.body.classList.add('rail-peek'),120)});
  r.addEventListener('mouseleave',()=>{clearTimeout(t);if(!railDesk())return;t=setTimeout(()=>{document.body.classList.remove('rail-peek');railAberto=pag().g;renderRail()},250)});})();

  const cs=grp(a,r=>r.col).sort((x,y)=>y.dia-x.dia);if(cs[0])dest.push({c:'at',i:'↑',h:'Colaborador com mais diárias: <a href="#colab">'+esc(cs[0].k)+'</a> ('+N(cs[0].dia)+' diárias, '+R(cs[0].tot)+').'});
  if(mesAnt&&!F.mes){const fc=mesAt,an=mesAnt;const v1=sum(am.filter(r=>r.mes===an),r=>r.tot);const MD=MESES_DADOS(),m2=MD.slice(-2)[0],m3=MD.slice(-3)[0];const vb=Object.keys(BASES).map(b=>{const x=sum(am.filter(r=>r.mes===m2&&r.b===b),r=>r.tot),y=sum(am.filter(r=>r.mes===m3&&r.b===b),r=>r.tot);return {b,x,y,d:x-y}}).sort((p,q)=>q.d-p.d);

  if(pend)dest.push({c:'mal',i:'!',h:'<a href="#qualidade">'+N(pend)+' lançamentos</a> com pendência ('+FLAGS.filter(f=>f.b&PMASK).map(f=>f.nm.charAt(0).toLowerCase()+f.nm.slice(1)).join(', ')+').'});
  return '<div class="vgh"><div class="vgh-top"><div class="ubar-l"><span class="ubar-ic">'+ico('home')+'</span><div><span class="ubar-tag">Central de Hospedagem · Administrativo CGB</span><h2>Visão geral</h2><span class="vgh-ate">'+esc(ctxTxt())+' · dados até <b>'+dt(Math.floor(CUT/864e5))+'</b></span></div></div><div class="vgh-hora"><b>'+R(tot)+'</b><small>Gasto no período</small></div></div>'+
   '<div class="vgh-pulso">'+porBase.map(x=>'<a class="vgp" href="#bases" data-setbase="'+x.b+'" style="--pc:'+(F.base===x.b?'#ffd27a':'#c9b3b8')+'"><i></i><span><small>'+bnome(x.b)+'</small><b>'+Rk(x.v)+'</b></span></a>').join('')+
   '<a class="vgp" href="#gerencia" style="--pc:'+({ate:'#44d27a',par:'#ffb648',nao:'#ff5a6e',nd:'#c9b3b8'}[s.c])+'"><i></i><span><small>Consumo da meta</small><b>'+P(pc)+'</b></span></a></div></div>'+chips()+
   '<div class="k6">'+
   icard('Gasto no período',periodoTxt(),Rk(tot),mp!=null?pill(pc):'<span class="pill nd">Sem meta com filtro de base</span>',[['Meta do período',mp!=null?R(mp):'–'],['Meta anual',ma!=null?R(ma):'–']],'gerencia',s.c)+

   '</div><div class="vg2">'+panel('Gasto mês a mês',F.base?'realizado':'realizado × meta mensal',colChart(itens,{aria:'Gasto mensal com meta'})+'<p class="tnota">Clique num mês para filtrar todos os painéis.</p>')+

PG.mensal=()=>{

  const linhas=ms.map((m,i)=>{const x=am.filter(r=>r.mes===m),v=sum(x,r=>r.tot),mt=F.base?null:metaPer(null,[m]);acR+=v;acM+=mt||0;const ant=i?sum(am.filter(r=>r.mes===ms[i-1]),r=>r.tot):null;

  let ws=null,A=null,hi=-1;for(const n of wb.SheetNames){const t=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});const i=t.findIndex(r=>r&&r.some(c=>txt(c)==='VALOR')&&r.some(c=>txt(c)==='SERVIÇO')&&r.some(c=>txt(c)==='CODIGO GERENCIAL'));if(i>=0){A=t;hi=i;break}}

  const H={};A[hi].forEach((c,i)=>{const k=txt(c);if(k&&!(k in H))H[k]=i});const g=(r,k)=>H[k]==null?null:r[H[k]];
  const TIPO={'Self-Service Almoço':'Almoço','Self-Service Jantar':'Jantar','Self-Service Café':'Café da Manhã'};const seen=new Map(),out=[];
  for(const r of A.slice(hi+1)){if(!r||!r.some(c=>c!=null&&c!==''))continue;let d=null,hr=null;const v0=g(r,'DATA');
    if(typeof v0==='number'){d=Math.floor(v0)-25569;hr=Math.floor((v0%1)*24+1e-6)}else{const m=/(\d+)\/(\d+)\/(\d{4})(?:\s+(\d+))?/.exec(txt(v0));if(m){d=Math.round(Date.UTC(+m[3],+m[2]-1,+m[1])/864e5);hr=m[4]!=null?+m[4]:null}}
    if(d==null)continue;let fl=0;const cod=txt(g(r,'CODIGO GERENCIAL')),c=CCT[cod];if(!c)fl|=16;let tipo=txt(g(r,'SERVIÇO'));if(!tipo){fl|=8;tipo='NÃO INFORMADO'}
    const v=numv(g(r,'VALOR'))||0;if(v<=0)fl|=32;if(v>LIM_A)fl|=4;const col=txt(g(r,'COLABORADOR'));const k=col+'|'+d+'|'+(TIPO[tipo]||tipo);seen.set(k,(seen.get(k)||0)+1);if(seen.get(k)>1)fl|=64;
    const x=new Date(d*864e5);out.push({b:txt(g(r,'BASE')),cid:txt(g(r,'CIDADE')),est:txt(g(r,'ESTABELECIMENTO')),col,sol:txt(g(r,'SOLICITAÇÃO')),aut:txt(g(r,'AUTORIZADO')),cod,cc:c?c[0]:txt(g(r,'CCUSTO'))||'SEM CENTRO DE CUSTO',ger:c?c[1]:txt(g(r,'GERÊNCIA'))||'SEM GERÊNCIA',area:c?c[2]:txt(g(r,'CCUSTO'))||'SEM CENTRO DE CUSTO',mot:txt(g(r,'MOTIVO')),tipo,ent:d,sai:d,hr,mes:x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0'),dia:1,pr:v,tot:Math.round(v*100)/100,q:1,nf:txt(g(r,'NF')),st:'',conf:'',fl})}

async function processarAlim(f){
  const box=$('arqs');if(!f)return;box.innerHTML='<div class="arq"><span class="tag">…</span><span class="nome">'+esc(f.name)+'</span><span class="st-ok">lendo… (arquivo grande, pode levar alguns segundos)</span></div>';
  try{await lib(XLSX_URL)}catch(e){box.innerHTML='<div class="note err">Não consegui carregar o leitor de Excel. Verifique a conexão e tente de novo.</div>';return}
  try{const rs=parseAlim(XLSX.read(await f.arrayBuffer(),{type:'array'}));const hoje=new Date(),hj=String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();
    ROWS=rs;FONTE={};for(const b of new Set(rs.map(r=>r.b)))FONTE[b]={at:hj,origem:'arquivo enviado'};CUT=Date.UTC(hoje.getFullYear(),hoje.getMonth(),hoje.getDate(),12);
    let msg=N(rs.length)+' refeições carregadas ('+R(sum(rs,r=>r.tot))+').';
    if(DBX&&CAN_EDIT){try{await salvarAlim(rs,hj);msg+=' Salvas para todos.'}catch(e){msg+=' Não foi possível salvar para todos ('+(e.message||e.code)+').'}}
    render();if($('arqs'))$('arqs').innerHTML='<div class="arq"><span class="tag">APP</span><span class="nome">'+esc(f.name)+'</span><span class="st-ok">'+N(rs.length)+' refeições</span></div>';toast(msg)}
  catch(e){box.innerHTML='<div class="arq erro"><span class="tag">ERRO</span><span class="nome">'+esc(f.name)+'</span><span class="st-err">'+esc(e.message)+'</span></div>'}}
const KA=['b','cid','est','col','sol','aut','cod','cc','ger','area','mot','tipo','ent','hr','tot','nf','fl'];
async function salvarAlim(rs,hj){
  const old=(await DBX.doc('cfg/alim').get()).data();const s=JSON.stringify(rs.map(r=>KA.map(k=>r[k])));const parts=[];for(let i=0;i<s.length;i+=200000)parts.push(s.slice(i,i+200000));
  const ver=Date.now().toString(36);for(let i=0;i<parts.length;i++)await DBX.doc('partes/ALIM-'+ver+'-'+i).set({s:parts[i]});
  await DBX.doc('cfg/alim').set({ver,n:parts.length,at:hj,linhas:rs.length,cut:CUT});
  if(old&&old.ver)for(let i=0;i<old.n;i++){try{await DBX.doc('partes/ALIM-'+old.ver+'-'+i).delete()}catch(e){}}}
async function carregarAlim(){
  const m=(await DBX.doc('cfg/alim').get()).data();if(!m||!m.ver)return false;let s='';for(let i=0;i<m.n;i++){const d=(await DBX.doc('partes/ALIM-'+m.ver+'-'+i).get()).data();if(!d)return false;s+=d.s}
  const rs=JSON.parse(s).map(a=>{const o=Object.fromEntries(KA.map((k,i)=>[k,a[i]]));const x=new Date(o.ent*864e5);return Object.assign(o,{sai:o.ent,dia:1,pr:o.tot,q:1,st:'',conf:'',mes:x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')})});
  const fonte={};for(const b of new Set(rs.map(r=>r.b)))fonte[b]={at:m.at,origem:'arquivo enviado'};
  if(MODO==='alim'){ROWS=rs;FONTE=fonte;CUT=m.cut||CUT}else{DS.alim.rows=rs;DS.alim.fonte=fonte;DS.alim.cut=m.cut||DS.alim.cut}return true}
async function processar(files){
  if(isA())return processarAlim(files[0]);
  const box=$('arqs');if(!files.length)return;
  try{await lib(XLSX_URL)}catch(e){box.innerHTML='<div class="note err">Não consegui carregar o leitor de Excel. Verifique a conexão e tente de novo.</div>';return}
  const hoje=new Date(),hj=String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();const novos={};
  for(const f of files){const id='a'+Math.random().toString(36).slice(2);box.insertAdjacentHTML('beforeend','<div class="arq" id="'+id+'"><span class="tag">…</span><span class="nome">'+esc(f.name)+'</span><span class="st-ok">lendo…</span></div>');const el=$(id);
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const rs=parseWb(wb);const bs=[...new Set(rs.map(r=>r.b))].filter(Boolean);if(!rs.length)throw new Error('nenhum lançamento encontrado');
      for(const b of bs)novos[b]=rs.filter(r=>r.b===b);el.querySelector('.tag').textContent=bs.join(', ');el.lastChild.outerHTML='<span class="st-ok">'+N(rs.length)+' lançamentos · '+R(sum(rs,r=>r.tot))+'</span>'}
    catch(e){el.classList.add('erro');el.querySelector('.tag').textContent='ERRO';el.lastChild.outerHTML='<span class="st-err">'+esc(e.message)+'</span>'}}
  const bs=Object.keys(novos);if(!bs.length)return;
  ROWS=ROWS.filter(r=>!bs.includes(r.b)).concat(...bs.map(b=>novos[b]));bs.forEach(b=>FONTE[b]={at:hj,origem:'arquivo enviado'});CUT=Date.UTC(hoje.getFullYear(),hoje.getMonth(),hoje.getDate(),12);
  let msg='Dados de '+bs.map(bnome).join(', ')+' atualizados.';
  if(DBX&&CAN_EDIT){try{await salvarBases(novos,hj);msg+=' Salvos para todos.'}catch(e){msg+=' Não foi possível salvar para todos ('+(e.message||e.code)+').'}}
  const keep=box.innerHTML;render();if($('arqs'))$('arqs').innerHTML=keep;toast(msg)}
const K=['b','cid','est','col','sol','aut','cod','cc','ger','area','mot','ent','sai','mes','dia','pr','tot','q','nf','st','conf','fl'];
async function salvarBases(novos,hj){
  const meta=(await DBX.doc('cfg/bases').get()).data()||{};const nmeta={...meta};
  for(const b of Object.keys(novos)){const s=JSON.stringify(novos[b].map(r=>K.map(k=>r[k])));const parts=[];for(let i=0;i<s.length;i+=60000)parts.push(s.slice(i,i+60000));
    const ver=Date.now().toString(36);for(let i=0;i<parts.length;i++)await DBX.doc('partes/'+b+'-'+ver+'-'+i).set({s:parts[i]});
    const old=meta[b];nmeta[b]={ver,n:parts.length,at:hj,linhas:novos[b].length,cut:CUT};
    await DBX.doc('cfg/bases').set(nmeta);
    if(old&&old.ver)for(let i=0;i<old.n;i++){try{await DBX.doc('partes/'+b+'-'+old.ver+'-'+i).delete()}catch(e){}}}
}
async function carregarBases(){
  const meta=(await DBX.doc('cfg/bases').get()).data();if(!meta)return false;let mud=false;
  for(const b of Object.keys(meta)){const m=meta[b];if(!m||!m.ver)continue;try{let s='';for(let i=0;i<m.n;i++){const d=(await DBX.doc('partes/'+b+'-'+m.ver+'-'+i).get()).data();if(!d)throw 0;s+=d.s}
    const rs=JSON.parse(s).map(a=>Object.fromEntries(K.map((k,i)=>[k,a[i]])));const H=MODO==='hosp';const rw=(H?ROWS:DS.hosp.rows).filter(r=>r.b!==b).concat(rs);if(H){ROWS=rw;FONTE[b]={at:m.at,origem:'arquivo enviado'};if(m.cut&&m.cut>CUT)CUT=m.cut}else{DS.hosp.rows=rw;DS.hosp.fonte[b]={at:m.at,origem:'arquivo enviado'};if(m.cut&&m.cut>DS.hosp.cut)DS.hosp.cut=m.cut}mud=true}catch(e){}}
  return mud}
function parseMetas(wb){
  const ws=wb.Sheets[wb.SheetNames.find(n=>{const t=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true});return t.some(r=>r&&r.some(c=>txt(c)==='CODCCUSTO'))})];if(!ws)throw new Error('não encontrei a coluna CODCCUSTO');
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});const hi=A.findIndex(r=>r&&r.some(c=>txt(c)==='CODCCUSTO'));const H={};A[hi].forEach((c,i)=>{const k=txt(c).toUpperCase();if(k&&!(k in H))H[k]=i});
  const CM=isA()?'REFEIÇÃO':'HOSPEDAGEM';if(H[CM]==null||H.ANOMES==null)throw new Error('faltam as colunas ANOMES ou '+CM);
  const m={};let n=0;for(const r of A.slice(hi+1)){if(!r)continue;const cod=txt(r[H.CODCCUSTO]),d=serialDia(r[H.ANOMES]);if(!cod||d==null)continue;const x=new Date(d*864e5),mes=x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0');const v=numv(r[H[CM]])||0;(m[mes]=m[mes]||{})[cod]=Math.round(((m[mes][cod]||0)+v)*100)/100;n++}
  if(!n)throw new Error('nenhuma linha de meta encontrada');return m}
async function importarMetas(f){
  if(!f)return;const box=$('arqsM');box.innerHTML='<div class="arq"><span class="tag">…</span><span class="nome">'+esc(f.name)+'</span><span class="st-ok">lendo…</span></div>';

  catch(e){box.innerHTML='<div class="arq erro"><span class="tag">ERRO</span><span class="nome">'+esc(f.name)+'</span><span class="st-err">'+esc(e.message)+'</span></div>'}}
